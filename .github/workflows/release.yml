name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Conventional Commits drive versioning: feat → minor, fix → patch. Each push
  # to main opens/updates a release PR; merging that PR cuts the GitHub release.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: rp
        uses: googleapis/release-please-action@v4
        with:
          # Fine-grained PAT (Contents + Pull requests + Issues, read/write) so
          # the release PR is authored by a real user instead of github-actions[bot].
          # This removes the "approve workflows to run" gate and lets CI run on the
          # release PR automatically. Falls back to GITHUB_TOKEN if the secret is unset.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Only after a release is actually created: assemble + upload the assets.
  # Packing already happened locally (the .it files are committed), so this runs
  # on ubuntu-latest with no .exe — it just globs, aggregates, and uploads.
  assets:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      # Guard: never ship a release whose generated files are out of sync.
      - name: Verify no drift
        run: npm run check

      # Build the manifest AND collect the shipped .it files into release-assets/.
      # Driven by the tooling, so excluded mods (e.g. templates) are never shipped
      # and unchanged mods carry forward automatically (each build/ holds exactly
      # one latest .it).
      - name: Build manifest + collect assets
        run: npm run build-manifest -- --out manifestCatalog.json --assets release-assets

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" release-assets/* --clobber
