name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Conventional Commits drive versioning: feat → minor, fix → patch. Each push
  # to main opens/updates a release PR; merging that PR cuts the GitHub release.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # Mint a short-lived installation token from our GitHub App. The App's
      # private key never expires, so (unlike a fine-grained PAT) there's nothing
      # to renew on a schedule. Requires repo secrets RELEASE_PLEASE_APP_ID and
      # RELEASE_PLEASE_APP_PRIVATE_KEY; the App needs Contents + Pull requests +
      # Issues (read/write) and must be installed on this repo.
      - name: Mint a GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: rp
        uses: googleapis/release-please-action@v4
        with:
          # App token => the release PR is authored by the App bot, not
          # github-actions[bot]. That removes the "approve workflows to run" gate
          # and lets CI run on the release PR automatically.
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # If release-please left an open release PR, turn on GitHub native
      # auto-merge. Branch protection on main requires the CI checks (format,
      # validate, test), so GitHub holds the merge until they pass. We use the
      # App token (not GITHUB_TOKEN) so that when auto-merge finally lands the
      # PR, the resulting push to main re-triggers this workflow and cuts the
      # release. --repo avoids needing a git checkout in this job. Idempotent:
      # re-arming an already-armed PR is a no-op.
      - name: Enable auto-merge on the release PR
        if: ${{ steps.rp.outputs.pr }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_PR: ${{ steps.rp.outputs.pr }}
        run: |
          pr_number=$(echo "$RELEASE_PR" | jq -r '.number')
          gh pr merge "$pr_number" --auto --squash --repo "${{ github.repository }}"

  # Only after a release is actually created: assemble + upload the assets.
  # Packing already happened locally (the .it files are committed), so this runs
  # on ubuntu-latest with no .exe — the tooling reads each build.lock.json,
  # aggregates the manifest, and uploads.
  assets:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      # Guard: never ship a release whose generated files are out of sync.
      - name: Verify no drift
        run: npm run check

      # Build the manifest AND collect the shipped .it files into release-assets/.
      # Driven by the tooling, so excluded mods (e.g. templates) are never shipped
      # and unchanged mods carry forward automatically (each build/ holds exactly
      # one latest .it).
      - name: Build manifest + collect assets
        env:
          # `build-manifest --with-downloads` sums per-variant lifetime downloads
          # from the releases API. Authenticated => the 5,000 req/hr budget.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build-manifest -- --out manifestCatalog.json --assets release-assets --ref "${{ needs.release-please.outputs.tag_name }}" --with-downloads

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" release-assets/* --clobber

  # Cosmetic, last, and isolated: flip the release to prerelease if the merged
  # release PR carried the `prerelease` label. `needs: [release-please, assets]`
  # means it runs only after assets are safely uploaded, so a hiccup here can
  # never cost us the release artifacts; as its own job it fails loudly without
  # touching the upload. Uses --repo, so gh needs no checkout/git context.
  # GITHUB_TOKEN already has contents + PR write from the top-level permissions
  # block, and github.sha is the release PR's merge commit, which resolves back
  # to that PR and its labels.
  prerelease:
    needs: [release-please, assets]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Mark release as prerelease if labeled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          labels=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[].labels[].name')
          if echo "$labels" | grep -qx 'prerelease'; then
            echo "Found 'prerelease' label -> marking ${{ needs.release-please.outputs.tag_name }} as prerelease"
            gh release edit "${{ needs.release-please.outputs.tag_name }}" --prerelease --repo "${{ github.repository }}"
          else
            echo "No 'prerelease' label -> leaving ${{ needs.release-please.outputs.tag_name }} as a full release"
          fi
